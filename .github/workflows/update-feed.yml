name: Refresh HKJC Claude market feed

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-feed.yml'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-feed.yml'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: hkjc-claude-market-feed
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  refresh:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch fresh HKJC public pre-event market feed
        run: python scripts/fetch_hkjc_feed.py --days 7 --odds HAD HDC HIL CRS --out data/latest.json

      - name: Validate published feed
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path("data/latest.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["schema_version"] == "hkjc-claude-market-feed-v1"
          assert d["scope"] == "PREEVENT_PUBLIC_MARKETS_ONLY"
          assert d["match_count"] == len(d["matches"]) > 0
          assert p.stat().st_size < 500_000, f"feed too large for reliable retrieval: {p.stat().st_size} bytes"
          assert p.stat().st_size < 500_000, f"feed too large for reliable model retrieval: {p.stat().st_size} bytes"
          assert all(str(m["status"]).upper() == "PREEVENT" for m in d["matches"])
          ts = datetime.fromisoformat(d["frozen_at_utc"].replace("Z", "+00:00")).astimezone(timezone.utc)
          age = (datetime.now(timezone.utc) - ts).total_seconds()
          assert -300 <= age <= 300, f"feed timestamp not fresh: age={age:.1f}s"
          c = d["independence_contract"]
          assert all(v is False for v in c.values())
          print({
              "FEED_VALID": True,
              "matches": d["match_count"],
              "frozen_at_hkt": d["frozen_at_hkt"],
              "sha256": d["market_payload_sha256"],
          })
          PY

      - name: Publish latest.json through Git history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No feed change to publish."
            exit 0
          fi
          stamp="$(python - <<'PY'
          import json
          print(json.load(open('data/latest.json', encoding='utf-8'))['frozen_at_hkt'])
          PY
          )"
          git commit -m "feed: refresh HKJC market snapshot ${stamp}"
          git push origin HEAD:main
